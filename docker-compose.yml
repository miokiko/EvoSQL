services:
  evoagent:
    build: .
    ports:
    - 127.0.0.1:8080:8080
    environment:
      EVOAGENT_HOST: 0.0.0.0
      EVOAGENT_AUTH_REQUIRED: ${EVOAGENT_AUTH_REQUIRED:-false}
    env_file:
    - path: .env
      required: false
    volumes:
    - ./artifacts:/app/artifacts
    - ./database:/app/database:ro
    - ./knowledge:/app/knowledge:ro
    - ./evaluation:/app/evaluation:ro
  text2sql-mysql:
    image: mysql:8.4
    ports:
    - 127.0.0.1:${EVOAGENT_TEXT2SQL_DB_PORT:-3307}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${EVOAGENT_TEXT2SQL_ADMIN_PASSWORD:-evo-text2sql-local-root}
      MYSQL_DATABASE: evo_text2sql_eval
      MYSQL_USER: evo_text2sql_ro
      MYSQL_PASSWORD: ${EVOAGENT_TEXT2SQL_DB_PASSWORD:-evo-text2sql-local-readonly}
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_0900_ai_ci
    volumes:
    - text2sql_mysql_data:/var/lib/mysql
    - ./database/test1_full_20241118.sql:/docker-entrypoint-initdb.d/10-test1.sql:ro
    - ./database/init/99-readonly.sql:/docker-entrypoint-initdb.d/99-readonly.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 30
    profiles:
    - mysql
volumes:
  text2sql_mysql_data: null
